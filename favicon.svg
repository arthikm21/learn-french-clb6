<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bonjour! — Free CLB 6 French course">
  <defs>
    <linearGradient id="bonjour-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0061B8"/>
      <stop offset=".55" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#EF4135"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bonjour-bg)"/>
  <!-- Bonjour! monogram: white "B" -->
  <text x="30" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="44" fill="#FFFFFF">B</text>
  <!-- the "!" accent dot of Bonjour! -->
  <circle cx="49" cy="44" r="4.2" fill="#FFFFFF"/>
</svg>
